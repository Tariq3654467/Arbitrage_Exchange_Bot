# ===========================================
# ARBITRAGE BOT CONFIGURATION
# ===========================================

# ----- GENERAL SETTINGS -----
bot:
  name: "Arbitrage Cross-Exchange Bot"
  version: "1.0.0"
  paper_trading: false  # LIVE TRADING MODE: Real trading enabled - REAL FUNDS WILL BE USED
  testnet_mode: false   # PRODUCTION MODE: Using mainnet exchanges - REAL FUNDS WILL BE USED
  
# ----- TRADING PARAMETERS -----
trading:
  min_profit_threshold: 0.001  # Minimum profit % after all fees (0.001% = very small gap for frequent testing)
  max_trade_size_percent: 10  # Max % of available capital per trade
  max_slippage_percent: 1.0   # Max slippage for DEX trades
  order_timeout_seconds: 30   # Max time to wait for order execution
  retry_attempts: 3
  auto_discover_pairs: true   # Automatically discover trading pairs from exchanges
  max_discovered_pairs: 50   # Maximum number of pairs to auto-discover (prevents rate limits and file descriptor issues)
  preferred_quote_currencies:  # Prioritize pairs with these quote currencies
    - USDT
    - FDUSD
    - BTC
    - ETH
    - BUSD
    - USDC
  
# ----- RISK MANAGEMENT -----
risk:
  max_drawdown_percent: 20.0
  max_daily_loss_percent: 5.0
  max_position_size_usd: 10000
  emergency_stop_enabled: true
  
# ----- CEX EXCHANGES -----
# Enable exchanges in the dashboard after adding API keys
# Set testnet: true to use testnet/sandbox mode for testing
exchanges:
  cex:
    - name: binance
      enabled: true      # Enable in dashboard after adding API keys
      testnet: false     # PRODUCTION: Using Binance mainnet - REAL FUNDS
      order_type: market  # market or limit
      max_latency_ms: 50
      websocket_enabled: true
      
    - name: mexc
      enabled: false      # Enable in dashboard after adding API keys
      testnet: false      # MEXC doesn't have testnet
      order_type: market
      max_latency_ms: 50
      websocket_enabled: true

  # DEX EXCHANGES
  # Disabled by default - enable in dashboard after adding private keys
  dex:
    - name: galaswap
      enabled: true       # Enabled for Binance → Galaswap arbitrage
      chain: gala          # 'gala' for Gala Chain (recommended) or 'ethereum' if available
      router_address: "0x0000000000000000000000000000000000000000"  # Update with actual Galaswap router address
      factory_address: "0x0000000000000000000000000000000000000000"  # Update with actual Galaswap factory address
      # CRITICAL: Provide PUBLIC_KEY to avoid 404 errors and signature failures
      # The public key endpoint is deprecated (404). You MUST provide public_key in your config
      # or environment variable GALASWAP_PUBLIC_KEY to prevent signature validation errors.
      # Get your public key from Gala Games wallet or derive it from your private key.
      # public_key: "YOUR_BASE64_PUBLIC_KEY_HERE"  # Uncomment and add your public key
      # Note: Galaswap runs on Gala Chain. Get contract addresses from Gala Games documentation.
      # You'll also need Gala Chain RPC URL and a wallet private key.

# ----- BLOCKCHAIN NETWORKS -----
networks:
  ethereum:
    chain_id: 1
    gas_price_strategy: fast  # slow, average, fast
    max_gas_price_gwei: 100
    testnet_chain_id: 5  # Goerli testnet (or use Sepolia: 11155111)
    testnet_rpc_url: "https://goerli.infura.io/v3/YOUR_INFURA_KEY"  # Update with your testnet RPC
    
  bsc:
    chain_id: 56
    gas_price_strategy: fast
    max_gas_price_gwei: 10
    testnet_chain_id: 97  # BSC Testnet
    testnet_rpc_url: "https://data-seed-prebsc-1-s1.binance.org:8545/"
    
  polygon:
    chain_id: 137
    gas_price_strategy: fast
    max_gas_price_gwei: 500
    testnet_chain_id: 80001  # Mumbai testnet
    testnet_rpc_url: "https://matic-mumbai.chainstacklabs.com"
    
  gala:
    chain_id: 33139  # Gala Chain mainnet (update if different)
    gas_price_strategy: fast
    max_gas_price_gwei: 100
    rpc_url: "https://mainnet.galachain.io"  # Update with actual Gala Chain RPC URL
    # Note: Get RPC URL from Gala Games documentation or support

# ----- TRADING PAIRS -----
# Format: BASE/QUOTE
# Binance pairs for same-exchange arbitrage (triangular arbitrage)
# Core pairs for triangular arbitrage: BTC/USDT, ETH/USDT, ETH/BTC
trading_pairs:
  # FDUSD pairs (Binance specific - better liquidity)
  - symbol: BTC/FDUSD
    min_trade_amount: 0.001
    enabled: true
    
  - symbol: ETH/FDUSD
    min_trade_amount: 0.001
    enabled: true
  
  # USDT pairs (most liquid)
  - symbol: BTC/USDT
    min_trade_amount: 0.001
    enabled: true
    
  - symbol: ETH/USDT
    min_trade_amount: 0.001
    enabled: true
    
  - symbol: ETH/BTC
    min_trade_amount: 0.001
    enabled: true
    
  # BNB pairs (Binance native token)
  - symbol: BNB/USDT
    min_trade_amount: 0.01
    enabled: true
    
  - symbol: BNB/BTC
    min_trade_amount: 0.01
    enabled: true
    
  - symbol: BNB/ETH
    min_trade_amount: 0.01
    enabled: true
  
  # Additional popular pairs for more opportunities
  - symbol: SOL/USDT
    min_trade_amount: 0.1
    enabled: true
    
  - symbol: ADA/USDT
    min_trade_amount: 1.0
    enabled: true
    
  - symbol: DOT/USDT
    min_trade_amount: 0.1
    enabled: true
    
  - symbol: LINK/USDT
    min_trade_amount: 0.1
    enabled: true
    
  - symbol: MATIC/USDT
    min_trade_amount: 10
    enabled: true
    
  - symbol: AVAX/USDT
    min_trade_amount: 0.1
    enabled: true
    
  - symbol: XRP/USDT
    min_trade_amount: 1.0
    enabled: true
    
  - symbol: DOGE/USDT
    min_trade_amount: 10
    enabled: true
    
  - symbol: LTC/USDT
    min_trade_amount: 0.01
    enabled: true
    
  - symbol: UNI/USDT
    min_trade_amount: 0.1
    enabled: true
    
  - symbol: AAVE/USDT
    min_trade_amount: 0.01
    enabled: true
    
  # Gala token (for Galaswap cross-exchange arbitrage when API is working)
  - symbol: GALA/USDT
    min_trade_amount: 0.01
    enabled: true

  # Common Gala Chain pairs for Galaswap
  - symbol: GALA/GUSDT
    min_trade_amount: 1.0
    enabled: true

  - symbol: GUSDT/GALA
    min_trade_amount: 1.0
    enabled: true

  - symbol: GALA/GUSDC
    min_trade_amount: 1.0
    enabled: true

  - symbol: GUSDC/GALA
    min_trade_amount: 1.0
    enabled: true

# ----- REBALANCING -----
rebalancing:
  enabled: true
  check_interval_minutes: 60
  target_allocation:
    USDT: 50  # 50% in stablecoin
    BTC: 20
    ETH: 20
    BNB: 5
    MATIC: 5
  rebalance_threshold_percent: 10  # Trigger if deviation > 10%

# ----- MONITORING -----
monitoring:
  dashboard_enabled: true
  dashboard_port: 3000
  prometheus_enabled: true
  prometheus_port: 9090
  
  alerts:
    telegram_enabled: true
    email_enabled: true
    alert_on_trade: true
    alert_on_error: true
    alert_on_high_profit: true
    high_profit_threshold: 2.0  # Alert if profit > 2%

# ----- DATA STORAGE -----
storage:
  save_price_data: true
  save_trade_history: true
  data_retention_days: 90
  
# ----- PERFORMANCE -----
performance:
  max_concurrent_opportunities: 5
  # Increase interval to reduce Binance REST API load and avoid 429 rate-limit errors.
  # 1500ms ≈ 0.66 requests/second per pair, which is much safer than 500ms.
  price_update_interval_ms: 1500
  order_book_depth: 10

